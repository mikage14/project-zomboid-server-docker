version: "3.7"
services:
  pzserver:
    restart: unless-stopped
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        STEAM_BETA: ${STEAM_BETA-legacy41}
    env_file:
      - .env
    environment:
      STEAM_BETA: ${STEAM_BETA-legacy41}
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    volumes:
      # Server data
      - ./data:/home/steam/Zomboid
      # Workshop mods folder
      - ./workshop-mods:/home/steam/pz-dedicated/steamapps/workshop
